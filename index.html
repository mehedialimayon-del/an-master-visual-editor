<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AN Master Visual Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font:14px system-ui}header,.tools{padding:10px;display:flex;gap:8px;flex-wrap:wrap;background:#191919}button,input{padding:9px;border-radius:7px;border:1px solid #555;background:#282828;color:white}button{cursor:pointer}.primary{background:#f60}.canvas{position:relative;width:min(96vw,390px);aspect-ratio:390/640;background:white;margin:12px auto;overflow:hidden;border:2px solid #f60;touch-action:none}.item{position:absolute;touch-action:none;user-select:none;display:grid;place-items:center;overflow:hidden}.selected{outline:2px dashed #f60}.item img{width:100%;height:100%;pointer-events:none}.tools{max-width:600px;margin:auto}.tools label{display:flex;align-items:center;gap:5px}.tools input{max-width:120px}@media(max-width:600px){body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex:none;align-items:center;gap:6px;padding:8px}header strong{width:100%;font-size:14px}header button{padding:8px 10px;font-size:13px}header label{font-size:0;position:relative;display:inline-flex;align-items:center;justify-content:center;background:#282828;border:1px solid #555;border-radius:7px;padding:8px 10px;min-height:36px}header label:before{content:'+ Image';font-size:13px}header input[type=file]{position:absolute;inset:0;width:100%!important;opacity:0;cursor:pointer}.canvas{width:min(calc((100dvh - 265px)*390/640),calc(100vw - 24px),390px);max-height:calc(100dvh - 265px);min-height:120px;margin:8px auto;flex:none}.tools{flex:1;min-height:0;overflow:auto;align-content:start;padding:8px;gap:6px}.tools label{font-size:12px}.tools input{max-width:92px;padding:7px}.tools button{padding:8px}} </style></head><body><header><strong style="color:#f60">AN MASTER VISUAL EDITOR</strong><button id="text">+ Text</button><button id="button">+ Button</button><label>+ Image <input id="image" type="file" accept="image/*" style="width:110px"></label><button id="save" class="primary">Save</button><button id="preview">Preview</button></header><main id="canvas" class="canvas"></main><section class="tools"><label>Text <input id="label"></label><label>Size <input id="size" type="number" min="8" max="120"></label><label>Width <input id="width" type="number" min="20" max="390"></label><label>Height <input id="height" type="number" min="20" max="640"></label><label>Color <input id="color" type="color"></label><label>URL <input id="url" placeholder="https://"></label><label>Fit <select id="fit"><option>contain</option><option>cover</option><option>fill</option></select></label><button id="delete">Delete</button><button id="export">Export HTML</button></section><script>
const $=id=>document.getElementById(id),canvas=$('canvas');let items=[],selected='',preview=false;const safe=u=>/^https?:\/\//i.test(u)||/^\/(?!\/)/.test(u),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function add(type,src=''){let i={id:Math.random().toString(36).slice(2),type,x:30,y:50,w:type==='image'?280:160,h:type==='image'?200:50,label:type==='button'?'Open Page':'Edit text',size:20,color:'#111111',url:'',src,fit:'contain'};items.push(i);selected=i.id;render()}function render(){canvas.replaceChildren();for(const i of items){let el=document.createElement('div');el.className='item'+(!preview&&selected===i.id?' selected':'');el.style.cssText='left:'+i.x/390*100+'%;top:'+i.y/640*100+'%;width:'+i.w/390*100+'%;height:'+i.h/640*100+'%;color:'+i.color+';font-size:'+i.size+'px;background:'+(i.type==='button'?'#f60':'transparent');if(i.type==='image'){let img=document.createElement('img');img.src=i.src;img.style.objectFit=i.fit;el.append(img)}else el.textContent=i.label;el.addEventListener('pointerdown',e=>{if(preview)return;e.preventDefault();selected=i.id;el.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=i.x,oy=i.y;const move=v=>{i.x=Math.max(0,Math.min(390-i.w,ox+(v.clientX-sx)*390/canvas.clientWidth));i.y=Math.max(0,Math.min(640-i.h,oy+(v.clientY-sy)*640/canvas.clientHeight));el.style.left=i.x/390*100+'%';el.style.top=i.y/640*100+'%'};const stop=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',stop);el.removeEventListener('pointercancel',stop);render()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop)});el.onclick=()=>{if(preview&&i.type==='button'&&safe(i.url))window.open(i.url,'_blank','noopener,noreferrer');else if(!preview){selected=i.id;render()}};canvas.append(el)}let i=items.find(v=>v.id===selected);if(i){for(let k of ['label','size','color','url','fit'])$(k).value=i[k];$('width').value=i.w;$('height').value=i.h}}$('text').onclick=()=>add('text');$('button').onclick=()=>add('button');$('image').onchange=e=>{let f=e.target.files[0];if(!f||!f.type.startsWith('image/')||f.size>5e6){alert('Choose an image under 5MB');return}let r=new FileReader;r.onload=()=>add('image',r.result);r.readAsDataURL(f)};for(let [field,key] of [['label','label'],['size','size'],['width','w'],['height','h'],['color','color'],['url','url'],['fit','fit']])$(field).oninput=e=>{let i=items.find(v=>v.id===selected);if(!i)return;i[key]=['size','w','h'].includes(key)?Number(e.target.value):e.target.value;if(key==='w')i.w=Math.max(20,Math.min(390-i.x,i.w));if(key==='h')i.h=Math.max(20,Math.min(640-i.y,i.h));render()};$('delete').onclick=()=>{items=items.filter(i=>i.id!==selected);selected='';render()};$('save').onclick=()=>{try{localStorage.setItem('an-mve-v1',JSON.stringify(items));alert('Saved locally')}catch{alert('Storage full or unavailable')}};$('preview').onclick=()=>{preview=!preview;$('preview').textContent=preview?'Edit':'Preview';render()};$('export').onclick=()=>{let parts=items.map(i=>{let s='position:absolute;left:'+i.x/390*100+'%;top:'+i.y/640*100+'%;width:'+i.w/390*100+'%;height:'+i.h/640*100+'%;font-size:'+i.size+'px;color:'+i.color+';';if(i.type==='image')return '<img alt="" src="'+escape(i.src)+'" style="'+s+'object-fit:'+i.fit+'">';if(i.type==='button')return '<a href="'+escape(safe(i.url)?i.url:'#')+'" style="'+s+'background:#f60;display:grid;place-items:center">'+escape(i.label)+'</a>';return '<div style="'+s+'">'+escape(i.label)+'</div>'}).join('');let html='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><main style="position:relative;width:min(100%,390px);aspect-ratio:390/640;margin:auto;overflow:hidden;background:white">'+parts+'</main>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='visual-page.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};try{let saved=JSON.parse(localStorage.getItem('an-mve-v1')||'[]');items=Array.isArray(saved)?saved.filter(i=>i&&['image','text','button'].includes(i.type)&&Number.isFinite(i.x)&&Number.isFinite(i.y)):[]}catch{}render();
</script></body></html>
