const $=id=>document.getElementById(id),canvas=$('canvas');let items=[],selected='',preview=false;let W=390,H=640,layout='fixed';const stage=document.createElement('div');stage.className='stage';canvas.append(stage);function pageHeight(){return layout==='scroll'?H*2:H}function applyLayout(){canvas.dataset.layout=layout;canvas.classList.toggle('preview',preview);stage.style.height=layout==='scroll'?'200%':'100%';$('layout').value=layout}let pages=[{name:'Home',items:[]}],pageIndex=0,theme='classic';const themes={classic:{bg:'#fff',accent:'#ff6600'},dark:{bg:'#101010',accent:'#ff6600'},light:{bg:'#fff',accent:'#111'},blue:{bg:'#f6faff',accent:'#1869d4'}};let lastEditSignature='';function recordEdit(){const now=snapshot();if(now===lastEditSignature)return;lastEditSignature=now;remember()}document.querySelector('.tools').addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))recordEdit()});document.querySelector('.tools').addEventListener('pointerdown',e=>{if(e.target.matches('input[type=range],input[type=color],input[type=checkbox]'))recordEdit()});document.querySelector('.tools').addEventListener('change',e=>{if(e.target.matches('select,input[type=checkbox]'))lastEditSignature=''});const history=[],future=[];function snapshot(){syncPage();return JSON.stringify({pages,pageIndex,theme,layout,device:$('device').value})}function remember(){history.push(snapshot());if(history.length>40)history.shift();future.length=0}function restoreSnapshot(json){const v=JSON.parse(json);pages=v.pages;pageIndex=v.pageIndex;items=pages[pageIndex].items;theme=v.theme;layout=v.layout;selected='';$('theme').value=theme;$('device').value=v.device;const wh=v.device.split('x').map(Number);if(wh[0]&&wh[1]){W=wh[0];H=wh[1];canvas.style.aspectRatio=W+'/'+H}updatePages();applyTheme();render()}$('undo').onclick=()=>{if(!history.length)return;future.push(snapshot());restoreSnapshot(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(snapshot());restoreSnap
