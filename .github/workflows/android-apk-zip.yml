name: Visual Editor Android APK ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk-zip.yml', 'index.html', 'assets/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - name: Create isolated Android wrapper (do not modify web app)
        shell: bash
        run: |
          mkdir -p android-wrapper/app/src/main/assets android-wrapper/app/src/main/java/com/an/visualeditor
          cp index.html android-wrapper/app/src/main/assets/index.html
          mkdir -p android-wrapper/app/src/main/assets/assets android-wrapper/app/src/main/res/drawable-nodpi
          cp assets/an-visual-editor-icon.jpg android-wrapper/app/src/main/assets/assets/an-visual-editor-icon.jpg
          cp assets/an-visual-editor-icon.jpg android-wrapper/app/src/main/res/drawable-nodpi/an_icon.jpg
          cat > android-wrapper/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'ANVisualEditor'
          include ':app'
          EOF
          cat > android-wrapper/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android-wrapper/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.an.visualeditor'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.an.visualeditor'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          EOF
          cat > android-wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="AN Visual Editor" android:icon="@drawable/an_icon" android:roundIcon="@drawable/an_icon" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-wrapper/app/src/main/java/com/an/visualeditor/MainActivity.java <<'EOF'
          package com.an.visualeditor;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceResponse;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          public class MainActivity extends Activity {
              private WebView web;
              private android.webkit.ValueCallback<Uri[]> fileCallback;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  setContentView(web);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(false);
                  web.getSettings().setAllowContentAccess(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req) {
                          if("appassets.androidplatform.net".equals(req.getUrl().getHost())) { String p=req.getUrl().getPath(); try { if("/assets/index.html".equals(p)) return new WebResourceResponse("text/html","UTF-8",getAssets().open("index.html")); if("/assets/assets/an-visual-editor-icon.jpg".equals(p)) return new WebResourceResponse("image/jpeg",null,getAssets().open("assets/an-visual-editor-icon.jpg")); } catch(Exception e) { return null; } } return null;
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest req) {
                          Uri u=req.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          if ("https".equals(u.getScheme()) || "http".equals(u.getScheme())) {
                              startActivity(new Intent(Intent.ACTION_VIEW,u)); return true;
                          }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, android.webkit.ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if(fileCallback!=null) fileCallback.onReceiveValue(null);
                          fileCallback=callback;
                          try { startActivityForResult(params.createIntent(), 101); }
                          catch(Exception ex) { fileCallback=null; callback.onReceiveValue(null); return false; }
                          return true;
                      }
                  });
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
              @Override protected void onActivityResult(int code,int result,Intent data) {
                  super.onActivityResult(code,result,data);
                  if(code==101 && fileCallback!=null) {
                      fileCallback.onReceiveValue(android.webkit.WebChromeClient.FileChooserParams.parseResult(result,data));
                      fileCallback=null;
                  }
              }
              @Override public void onBackPressed() {
                  if(web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          sed -i '/import androidx.activity.result/d' android-wrapper/app/src/main/java/com/an/visualeditor/MainActivity.java
      - name: Build debug APK
        run: |
          cd android-wrapper
          gradle --no-daemon :app:assembleDebug
      - name: Verify APK and ZIP
        run: |
          test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p deliverable
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk deliverable/AN-Visual-Editor-debug.apk
          (cd deliverable && zip AN-Visual-Editor-APK.zip AN-Visual-Editor-debug.apk && unzip -t AN-Visual-Editor-APK.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: AN-Visual-Editor-APK-ZIP
          path: deliverable/AN-Visual-Editor-APK.zip
          if-no-files-found: error
