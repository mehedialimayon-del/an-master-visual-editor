name: Visual Editor Browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/source-syntax.cjs
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 &
      - run: npx playwright test tests/editor.spec.cjs --reporter=line
