name: Website Manager Browser QA
on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/website-manager.spec.cjs', '.github/workflows/website-manager-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tests/source-syntax.cjs
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mve-http.log 2>&1 &
      - run: npx playwright test tests/website-manager.spec.cjs --browser=chromium --workers=1
